<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>酒在庫管理</title>

<meta name="theme-color" content="#781313">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="酒在庫"
>

<link
  rel="apple-touch-icon"
  href="./icons/icon-180.png"
>

<link
  rel="manifest"
  href="./manifest.json"
>

<link
  rel="stylesheet"
  href="./style.css"
>
</head>

<body>

  <div class="app-container">

    <!-- ヘッダー -->
    <header class="app-header">

      <div>
        <h1>酒在庫管理</h1>
        <div id="itemCount" class="item-count">
          読み込み中...
        </div>
      </div>

      <button
        id="reloadButton"
        class="reload-button"
        type="button"
      >
        更新
      </button>

    </header>


    <!-- 検索 -->
    <section class="search-section">

      <input
        id="searchInput"
        type="search"
        placeholder="商品名を検索"
        autocomplete="off"
      >

    </section>


    <!-- カナ絞り込み -->
    <section class="kana-section">

      <div
        id="kanaFilter"
        class="kana-filter"
      >

        <button class="kana-button active" data-kana="all">
          全
        </button>

        <button class="kana-button" data-kana="a">
          ア
        </button>

        <button class="kana-button" data-kana="ka">
          カ
        </button>

        <button class="kana-button" data-kana="sa">
          サ
        </button>

        <button class="kana-button" data-kana="ta">
          タ
        </button>

        <button class="kana-button" data-kana="na">
          ナ
        </button>

        <button class="kana-button" data-kana="ha">
          ハ
        </button>

        <button class="kana-button" data-kana="ma">
          マ
        </button>

        <button class="kana-button" data-kana="ya">
          ヤ
        </button>

        <button class="kana-button" data-kana="ra">
          ラ
        </button>

        <button class="kana-button" data-kana="wa">
          ワ
        </button>

      </div>

    </section>


    <!-- 発注フィルター -->
    <section class="option-section">

      <button
        id="orderFilterButton"
        class="order-filter-button"
        type="button"
      >
        発注必要のみ
      </button>

    </section>


    <!-- PC用タイトル -->
    <div class="desktop-table-header">

      <div>画像</div>
      <div>商品名</div>
      <div>在庫</div>
      <div>状態</div>
      <div>在庫変更</div>

    </div>


    <!-- 商品一覧 -->
    <main
      id="inventoryList"
      class="inventory-list"
    >

      <div class="loading">
        在庫を読み込んでいます...
      </div>

    </main>

  </div>


  <!-- 通知 -->
  <div
    id="toast"
    class="toast"
  ></div>


  <script src="./app.js"></script>

<script>
  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("./service-worker.js")
          .then(registration => {

            console.log(
              "Service Worker registered:",
              registration.scope
            );

          })
          .catch(error => {

            console.error(
              "Service Worker registration failed:",
              error
            );

          });

      }
    );

  }
</script>

</body>
</html>
